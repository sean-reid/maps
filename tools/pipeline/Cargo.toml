[package]
name = "pipeline"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Builds series files and a search index from the World Bank WDI bulk download."

[lib]
name = "pipeline"

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
