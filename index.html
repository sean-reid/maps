<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>maps</title>
    <meta
      name="description"
      content="A world map where each country's area is the quantity being shown."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/schibsted-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>maps</h1>
      <input
        id="search"
        type="search"
        role="combobox"
        aria-label="Search series"
        aria-controls="results"
        aria-expanded="false"
        aria-autocomplete="list"
        autocomplete="off"
        spellcheck="false"
        disabled
      />
      <ul id="results" role="listbox" aria-label="Series" hidden></ul>
    </header>
    <main>
      <section class="series">
        <h2 id="title"></h2>
        <p id="detail"></p>
      </section>
      <canvas
        id="map"
        data-waiting
        tabindex="0"
        role="application"
        aria-label="World map. Arrow keys pan, plus and minus zoom, 0 resets, Enter picks the country at the centre, Escape clears it."
      ></canvas>
      <p id="readout" class="readout" aria-live="off"></p>
      <div id="time" class="time" hidden>
        <button id="play" type="button">Play</button>
        <input id="year" type="range" step="1" aria-label="Year" />
        <output id="year-label" class="num" for="year"></output>
      </div>
    </main>
    <footer>
      <a href="https://github.com/sean-reid/maps">source</a>
      <a href="https://www.naturalearthdata.com/">Natural Earth</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
